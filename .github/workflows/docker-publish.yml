name: Docker Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release tag to publish (also updates latest)"
        required: true
        default: "v0.8.7-loeminn.1"
        type: string
  push:
    tags:
      - "v*-loeminn.*"

permissions:
  contents: read

concurrency:
  group: dockerhub-publish
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.version || github.ref_name }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag and credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+)+-loeminn\.[0-9]+$ ]]; then
            echo "::error::Please select a version tag such as v0.8.7-loeminn.1"
            exit 1
          fi
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo "::error::Configure DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in repository secrets"
            exit 1
          fi

      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Get release commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run tests
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push version and latest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm/v7,linux/arm64
          build-args: |
            BUILD_SHA=${{ steps.source.outputs.sha }}
            BUILD_TAG=${{ env.RELEASE_TAG }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/quark-auto-save:${{ env.RELEASE_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/quark-auto-save:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}

      - name: Summarize publication
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Published tags: $RELEASE_TAG and latest" >> "$GITHUB_STEP_SUMMARY"
          echo "Both tags reference image digest: $IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
